name: Tests

on: [push, pull_request]

env:
    php-options: -d opcache.enable=0 -d zend.exception_ignore_args=0

jobs:
    tests:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest]
                php: ['8.2', '8.3', '8.4', '8.5']
                sapi: ['php', 'php-cgi']

            fail-fast: false

        name: PHP ${{ matrix.php }}/${{ matrix.sapi }} tests on ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v6
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: ds
                  coverage: none

            - run: composer install --no-progress --prefer-dist
            - run: composer tester -- -p ${{ matrix.sapi }} ${{ env.php-options }}
            - if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: output ${{ matrix.php }}-${{ matrix.sapi }}-${{ matrix.os }}
                  path: tests/**/output


    code_coverage:
        name: Code Coverage
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.2
                  extensions: ds
                  coverage: none

            - run: composer install --no-progress --prefer-dist
            - run: composer tester -- -p phpdbg ${{ env.php-options }} --coverage ./coverage.xml --coverage-src ./src
              continue-on-error: true
            - uses: coverallsapp/github-action@v2
              with:
                  file: coverage.xml
                  format: clover
